<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>قارئ الحديث</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="reader-page">
  <!-- navbar-placeholder -->
  <main class="container-xl py-4">
    <div class="row g-4">
      <aside class="col-lg-3">
        <section class="panel sticky-lg-top" style="top: 1rem">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="h5 mb-0">شجرة المجلدات</h2>
            <span class="badge text-bg-success">قارئ</span>
          </div>
          <div class="list-group list-group-flush small">
            <button class="list-group-item list-group-item-action active">أبو داود 1</button>
            <button class="list-group-item list-group-item-action">كتاب الإيمان</button>
            <button class="list-group-item list-group-item-action">باب البداءة بالحمد</button>
            <button class="list-group-item list-group-item-action">باب الاسم الأعظم</button>
            <button class="list-group-item list-group-item-action">باب: من خصال الشرك</button>
          </div>
        </section>
      </aside>
      <section class="col-lg-9">
        <div class="panel mb-3">
          <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
            <div class="d-flex flex-wrap gap-3 align-items-center">
              <div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" id="takhreej-toggle"><label class="form-check-label" for="takhreej-toggle">عرض التخريج</label></div>
              <div class="btn-group" role="group" aria-label="حجم الخط"><button id="font-increase" class="btn btn-outline-secondary">A+</button><button id="font-decrease" class="btn btn-outline-secondary">A-</button></div>
            </div>
            <button id="copy-btn" class="btn btn-primary">نسخ المحتوى</button>
          </div>
        </div>
        <article id="reader-container" class="reader-paper panel"></article>
      </section>
    </div>
  </main>
  <script>
    const hadithData = [
      { volume_name: "أبو داود 1", book_name: "كتاب الإيمان", chapter_name: "باب البداءة بالحمد في كل أمر ذي بال", hadith_text_html: "عن أبي هريرة رضي الله عنه، قال: قال رسول الله ﷺ: <strong>كل كلام لا يبدأ فيه بالحمد لله فهو أجذم</strong>.", long_takhreej: "رواه أبو داود (٤٨٠٧)، وصححه ابن حبان (٤٦٢٥).", hadith_type: "main", volume_id: 7 },
      { volume_name: "أبو داود 1", book_name: "كتاب الإيمان", chapter_name: "باب: من خصال الشرك", hadith_text_html: "عن عبد الله بن مسعود رضي الله عنه، قال: سمعت رسول الله ﷺ يقول: <strong>إن الرقى والتمائم والتولة شرك.</strong>", long_takhreej: "أخرجه أبو داود (٣٨٧٩)، ورواه ابن ماجه (٣٥٣٠).", hadith_type: "main", volume_id: 7 },
      { volume_name: "أبو داود 1", book_name: "كتاب الإيمان", chapter_name: "باب: من خصال الشرك", hadith_text_html: "وفي حديث عقبة بن عامر: <strong>من تعلق تميمة فقد أشرك.</strong>", short_takhreej: "رواه أحمد", long_takhreej: "رواه أحمد (١٧٦٧٦)، وصححه ابن حبان (٦٠٨٦).", hadith_type: "h_main", volume_id: 7 }
    ];
    let showTakhreej = false;
    let fontSize = 24;
    const reader = document.getElementById("reader-container");
    function grouped(data) {
      const output = [];
      data.forEach((item) => {
        if (item.hadith_type.startsWith("h_")) {
          const last = output[output.length - 1];
          if (last && last.isFootnote) last.items.push(item); else output.push({ isFootnote: true, items: [item] });
        } else output.push({ isFootnote: false, item });
      });
      return output;
    }
    function render() {
      const first = hadithData[0];
      let html = `<header class="reader-heading"><div class="text-secondary">${first.volume_name}</div><h1>${first.book_name}</h1><div class="text-success fw-bold">${first.chapter_name}</div></header>`;
      grouped(hadithData).forEach((entry) => {
        if (!entry.isFootnote) {
          html += `<p class="reader-text">${entry.item.hadith_text_html}${showTakhreej && entry.item.long_takhreej ? `<small class="d-block reader-reference">التخريج: ${entry.item.long_takhreej}</small>` : ""}</p>`;
        } else {
          html += `<aside class="reader-footnote">${entry.items.map((item) => `<p class="mb-2">${item.hadith_text_html}${showTakhreej ? `<small class="d-block reader-reference">${item.long_takhreej}</small>` : `<small class="text-primary">(${item.short_takhreej || ""})</small>`}</p>`).join("")}</aside>`;
        }
      });
      reader.innerHTML = html;
      reader.style.fontSize = `${fontSize}px`;
    }
    document.getElementById("takhreej-toggle").addEventListener("change", (event) => { showTakhreej = event.target.checked; render(); });
    document.getElementById("font-increase").addEventListener("click", () => { if (fontSize < 40) { fontSize += 2; render(); } });
    document.getElementById("font-decrease").addEventListener("click", () => { if (fontSize > 16) { fontSize -= 2; render(); } });
    document.getElementById("copy-btn").addEventListener("click", async (event) => { await navigator.clipboard.writeText(reader.innerText); event.currentTarget.textContent = "تم النسخ"; setTimeout(() => { event.currentTarget.textContent = "نسخ المحتوى"; }, 1800); });
    render();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
