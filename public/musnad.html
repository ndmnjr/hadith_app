<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>مسند الرواة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="musnad">
  <div data-navbar></div><script src="/js/navbar.js"></script>
  <main class="page-wrap">
    <header class="mb-3">
      <div class="hero-badge">المرويات</div>
      <h1 class="page-title">مسند الرواة</h1>
      <p class="page-subtitle">إظهار الرواة الذين لهم عدد محدد من المرويات ضمن نطاق معين.</p>
    </header>
    <form class="panel filters-panel" data-musnad-form>
      <div class="row g-3">
        <div class="col-md-3"><label class="form-label">عدد المرويات</label><input class="form-control" name="narration_count" type="number" min="1" value="1"></div>
        <div class="col-md-3"><label class="form-label">المجلد</label><input class="form-control filter-search" data-filter-search="volume" placeholder="بحث في المجلدات"><select class="form-select" data-filter-volume multiple size="4"></select></div>
        <div class="col-md-3"><label class="form-label">الكتاب</label><input class="form-control filter-search" data-filter-search="book" placeholder="بحث في الكتب"><select class="form-select" data-filter-book multiple size="4"></select></div>
        <div class="col-md-3"><label class="form-label">الباب</label><input class="form-control filter-search" data-filter-search="chapter" placeholder="بحث في الأبواب"><select class="form-select" data-filter-chapter multiple size="4"></select></div>
      </div>
      <div class="mt-3 d-flex gap-2"><button class="btn btn-primary" type="submit">بحث</button><button class="btn btn-outline-secondary" type="button" data-clear-filters>مسح</button></div>
    </form>
    <div class="export-bar"><button class="btn btn-outline-primary" data-export="excel">تصدير Excel</button><button class="btn btn-outline-primary" data-export="word">تصدير Word</button><button class="btn btn-outline-primary" data-export="pdf">تصدير PDF</button></div>
    <div class="status" data-status></div><section data-results></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="/js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
