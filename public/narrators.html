<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>البحث في الرواة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="narrators">
  <nav class="navbar navbar-expand-lg topbar"><div class="container-fluid page-wrap py-2">
    <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="/index.html"><span class="brand-mark">ح</span><span>كتب الحديث</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav me-auto gap-1">
      <a class="nav-link" data-nav="browse" href="/browse.html">عرض الكتب</a><a class="nav-link" data-nav="search" href="/search.html">البحث في الحديث</a><a class="nav-link" data-nav="index" href="/hadith-index.html">فهرس الأطراف</a><a class="nav-link" data-nav="narrators" href="/narrators.html">البحث في الرواة</a><a class="nav-link" data-nav="musnad" href="/musnad.html">مسند الرواة</a>
    </div></div>
  </div></nav>
  <main class="page-wrap">
    <header class="mb-3"><h1 class="page-title">البحث في الرواة</h1><p class="page-subtitle">ابحث باسم الراوي أو أحد أسمائه الأخرى، ثم اعرض مروياته.</p></header>
    <form class="panel filters-panel" data-rawi-form>
      <div class="row g-3">
        <div class="col-lg-4">
          <label class="form-label">اسم الراوي</label>
          <div class="input-group">
            <input class="form-control" name="rawi_query" list="rawiSuggestions" placeholder="مثال: ابن عمر">
            <button class="btn btn-outline-primary" type="button" data-add-rawi>إضافة</button>
          </div>
          <datalist id="rawiSuggestions" data-rawi-suggestions></datalist>
          <div class="mt-2" data-rawi-chips></div>
        </div>
        <div class="col-lg-2"><label class="form-label">المجلد</label><select class="form-select" data-filter-volume multiple size="4"></select></div>
        <div class="col-lg-3"><label class="form-label">الكتاب</label><select class="form-select" data-filter-book multiple size="4"></select></div>
        <div class="col-lg-3"><label class="form-label">الباب</label><select class="form-select" data-filter-chapter multiple size="4"></select></div>
      </div>
      <div class="mt-3"><button class="btn btn-primary" type="submit">عرض المرويات</button></div>
    </form>
    <div class="export-bar"><button class="btn btn-outline-primary" data-export="excel">تصدير Excel</button><button class="btn btn-outline-primary" data-export="word">تصدير Word</button><button class="btn btn-outline-primary" data-export="pdf">تصدير PDF</button></div>
    <div class="status" data-status></div><section data-results></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="/js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
