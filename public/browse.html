<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>عرض المجلدات والأحاديث</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="browse">
  <div data-navbar></div><script src="/js/navbar.js"></script>
  <main class="page-wrap">
    <header class="mb-3"><h1 class="page-title">عرض المجلدات والأحاديث</h1><p class="page-subtitle">تصفح شجري ثم عرض النصوص حسب ترتيبها.</p></header>
    <section class="panel filters-panel mb-3">
      <div class="toolbar">
        <div><label class="form-label">المجلد</label><select class="form-select" data-browse-volume></select></div>
        <div><label class="form-label">حجم النص</label><input class="form-range" type="range" min="18" max="34" value="22" data-reading-size></div>
        <div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="show_takhreej" id="showTakhreej"><label class="form-check-label" for="showTakhreej">إظهار التخريج الكامل</label></div>
      </div>
    </section>
    <button class="tree-toggle" type="button" data-tree-toggle aria-expanded="false" aria-controls="browse-tree" aria-label="عرض الكتب والأبواب" title="عرض الكتب والأبواب">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
    <div class="tree-layout">
      <aside class="panel tree-list" id="browse-tree" data-tree>
        <button class="tree-close" type="button" data-tree-close aria-label="إغلاق قائمة الكتب والأبواب">إغلاق</button>
        <div class="text-muted">اختر مجلداً لعرض الكتب والأبواب.</div>
      </aside>
      <section>
        <div class="export-bar"><button class="btn btn-outline-primary" data-export="excel">تصدير Excel</button><button class="btn btn-outline-primary" data-export="word">تصدير Word</button><button class="btn btn-outline-primary" data-export="pdf">تصدير PDF</button></div>
        <div class="status" data-status></div>
        <div data-content class="mt-2"></div>
      </section>
      
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="/js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
