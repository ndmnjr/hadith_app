<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>البحث في الأحاديث</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="search">
  <!-- navbar-placeholder -->
  <main class="page-wrap">
    <header class="mb-3">
      <div class="hero-badge">البحث العلمي</div>
      <h1 class="page-title">البحث في الأحاديث</h1>
      <p class="page-subtitle">بحث نصي مع فلاتر المجلد والكتاب والباب ونوع النص.</p>
    </header>
    <form class="panel filters-panel" data-search-form>
      <div class="row g-3">
        <div class="col-lg-4">
          <label class="form-label">عبارة البحث</label>
          <input class="form-control" name="query" placeholder="اكتب كلمة أو جملة">
        </div>
        <div class="col-lg-2"><label class="form-label">المجلد</label><select class="form-select" data-filter-volume multiple size="4"></select></div>
        <div class="col-lg-2"><label class="form-label">الكتاب</label><select class="form-select" data-filter-book multiple size="4"></select></div>
        <div class="col-lg-2"><label class="form-label">الباب</label><select class="form-select" data-filter-chapter multiple size="4"></select></div>
        <div class="col-lg-2">
          <label class="form-label">النوع</label>
          <select class="form-select" name="types" multiple size="4">
            <option value="main">أصل</option>
            <option value="sub">تابع</option>
            <option value="part">جزء</option>
            <option value="h_main">حاشية أصل</option>
            <option value="h_part">حاشية جزء</option>
          </select>
        </div>
      </div>
      <div class="mt-3"><button class="btn btn-primary" type="submit">بحث</button></div>
    </form>
    <div class="export-bar">
      <button class="btn btn-outline-primary" data-export="excel">تصدير Excel</button>
      <button class="btn btn-outline-primary" data-export="word">تصدير Word</button>
      <button class="btn btn-outline-primary" data-export="pdf">تصدير PDF</button>
    </div>
    <div class="status" data-status></div>
    <section data-results></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
